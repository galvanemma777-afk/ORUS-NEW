<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#24063f" />
  <title>ORUS Uruguay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ec1a85;
      --magenta: #c21cf0;
      --violet: #6a3dff;
      --text: #ffffff;
      --muted: #b9a9c4;
      --online: #2bf07f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 90% 45% at 50% 0%, #4a0d8c 0%, rgba(74,13,140,0) 70%),
        radial-gradient(ellipse 80% 40% at 50% 100%, #3a0620 0%, rgba(58,6,32,0) 75%),
        linear-gradient(180deg, #24063f 0%, #150318 55%, #0c0208 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3dvh, 28px);
      padding: clamp(16px, 4dvh, 40px) 20px calc(clamp(16px, 4dvh, 40px) + env(safe-area-inset-bottom));
    }

    /* ===== Logo ===== */
    .logo {
      width: clamp(130px, 27dvh, 200px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #3b1d9a 0%, #1a0a4d 55%, #0b0426 100%);
      border: 3px solid var(--pink);
      box-shadow:
        0 0 18px rgba(236, 26, 133, 0.75),
        0 0 60px rgba(236, 26, 133, 0.35),
        inset 0 0 25px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: glow 3s ease-in-out infinite;
      margin-bottom: clamp(0px, 1dvh, 10px);
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 18px rgba(236,26,133,.75), 0 0 60px rgba(236,26,133,.35), inset 0 0 25px rgba(0,0,0,.6); }
      50%      { box-shadow: 0 0 26px rgba(236,26,133,.95), 0 0 85px rgba(236,26,133,.45), inset 0 0 25px rgba(0,0,0,.6); }
    }

    .logo-img {
      width: 100%;
      height: 100%;
      transform: scale(1.12) translateY(3%);
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    /* ===== Badge ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.05);
      font-size: clamp(11px, 3.2vw, 13px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 10px var(--online);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    /* ===== Tarjetas ===== */
    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.6dvh, 14px);
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: clamp(13px, 2.2dvh, 18px) 18px;
      border-radius: 20px;
      background: rgba(10, 2, 8, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .card.featured {
      background: linear-gradient(135deg, rgba(120, 12, 90, 0.35), rgba(20, 3, 18, 0.85));
      border-color: rgba(236, 26, 133, 0.4);
      box-shadow: 0 0 20px rgba(236, 26, 133, 0.12);
    }

    .icon {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.09);
      font-size: 15px;
    }

    .card.featured .icon {
      background: linear-gradient(135deg, #ff3fc8, #b20fe0);
      color: #fff;
      box-shadow: 0 0 14px rgba(236, 26, 133, 0.6);
    }

    .card h3 { font-size: clamp(15px, 4.2vw, 17px); font-weight: 700; }
    .card p  { font-size: clamp(12.5px, 3.6vw, 14px); color: var(--muted); margin-top: 3px; }

    /* ===== Botón ===== */
    .cta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: clamp(12px, 2dvh, 16px) 18px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-size: clamp(14px, 4.3vw, 17px);
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      white-space: nowrap;
      background: linear-gradient(90deg, #ff0a8a 0%, #b80dff 55%, #5b3cff 100%);
      box-shadow: 0 0 28px rgba(236, 26, 133, 0.5), 0 8px 24px rgba(91, 60, 255, 0.25);
      margin-top: clamp(4px, 1.5dvh, 14px);
      transition: transform .15s ease;
    }

    .cta { cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, filter .2s ease; }
    .cta:hover {
      transform: translateY(-3px) scale(1.03);
      filter: brightness(1.08);
      box-shadow: 0 0 40px rgba(236, 26, 133, 0.7), 0 12px 30px rgba(91, 60, 255, 0.35);
    }
    .cta:active { transform: scale(0.98); }

    .wa-icon { transition: transform .2s ease; }
    .cta:hover .wa-icon { animation: wiggle .6s ease-in-out infinite; }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0) scale(1.12); }
      25%      { transform: rotate(-14deg) scale(1.12); }
      75%      { transform: rotate(14deg) scale(1.12); }
    }

    .wa-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #25d366;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(37, 211, 102, 0.6);
    }

    @media (max-width: 360px) {
      .badge { letter-spacing: 1px; padding: 8px 14px; }
      .cta { letter-spacing: .5px; gap: 8px; }
      .wa-icon { width: 34px; height: 34px; }
    }
  </style>
